<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rangahala — Book</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M6 14a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v4a4 4 0 0 0 0 8v4a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-4a4 4 0 0 0 0-8z' fill='%23f2a93b'/%3E%3Cpath d='M24 10v28' stroke='%2314162b' stroke-width='2' stroke-dasharray='3 4'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%23ff6b5b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <svg class="brand__logo" width="28" height="28" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 14a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v4a4 4 0 0 0 0 8v4a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-4a4 4 0 0 0 0-8z" fill="var(--amber)" />
        <path d="M24 10v28" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 4" />
        <circle cx="24" cy="24" r="5" fill="var(--coral)" />
      </svg>
      Ranga<span>hala</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="event-page" id="event-detail">
    <a class="back-link" href="events.html">← All events</a>

    <p id="event-category"></p>
    <h1 id="event-title"></h1>
    <p id="event-venue"></p>
    <p id="event-datetime"></p>
    <p id="event-blurb"></p>

    <form class="booking-form" id="booking-form">
      <h2>Choose your ticket</h2>

      <div id="tier-list"></div>

      <div class="form-row">
        <div class="form-field">
          <label for="qty">Quantity</label>
          <input type="number" id="qty" min="1" max="10" value="1" />
        </div>
        <div class="form-field">
          <label for="buyer-name">Full name</label>
          <input type="text" id="buyer-name" required placeholder="As it should appear on the ticket" />
        </div>
        <div class="form-field">
          <label for="buyer-contact">Email or phone</label>
          <input type="text" id="buyer-contact" required placeholder="you@example.com" />
          <span class="field-error" id="buyer-contact-error">Enter a valid email or phone number.</span>
        </div>
      </div>

      <div class="total-row">
        <span>Total</span>
        <span id="total-price"></span>
      </div>

      <button type="submit" class="submit-btn">Confirm booking</button>
    </form>
  </main>

  <script src="script.js"></script>
</body>
</html>
