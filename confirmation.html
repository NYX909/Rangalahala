<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rangahala — Your ticket</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cpath d='M6 14a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v4a4 4 0 0 0 0 8v4a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-4a4 4 0 0 0 0-8z' fill='%23f2a93b'/%3E%3Cpath d='M24 10v28' stroke='%2314162b' stroke-width='2' stroke-dasharray='3 4'/%3E%3Ccircle cx='24' cy='24' r='5' fill='%23ff6b5b'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="site-header">
    <a class="brand" href="index.html">
      <svg class="brand__logo" width="28" height="28" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M6 14a4 4 0 0 1 4-4h28a4 4 0 0 1 4 4v4a4 4 0 0 0 0 8v4a4 4 0 0 1-4 4H10a4 4 0 0 1-4-4v-4a4 4 0 0 0 0-8z" fill="var(--amber)" />
        <path d="M24 10v28" stroke="var(--ink)" stroke-width="2" stroke-dasharray="3 4" />
        <circle cx="24" cy="24" r="5" fill="var(--coral)" />
      </svg>
      Ranga<span>hala</span>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="events.html">Events</a>
      <a href="contact.html">Contact</a>
    </nav>
  </header>

  <main class="confirmation-page" id="ticket-result">
    <p class="eyebrow">Booking confirmed</p>
    <h1>You're going. Here's your ticket.</h1>

    <div class="ticket-stub-final">
      <div class="ticket-stub-final__top">
        <span id="ticket-event"></span>
        <dl>
          <dt>Venue</dt>
          <dd id="ticket-venue"></dd>
          <dt>When</dt>
          <dd id="ticket-datetime"></dd>
          <dt>Ticket</dt>
          <dd id="ticket-tier"></dd>
          <dt>Booked by</dt>
          <dd id="ticket-buyer"></dd>
          <dt>Total paid</dt>
          <dd id="ticket-total"></dd>
        </dl>
      </div>
      <div class="ticket-stub-final__bottom">
        <div>
          <span class="ticket-stub-final__ref-label">Reference</span>
          <span class="ticket-stub-final__ref" id="ticket-reference"></span>
        </div>
        <div class="barcode" aria-hidden="true">
          <span style="height:60%"></span><span style="height:90%"></span><span style="height:40%"></span>
          <span style="height:75%"></span><span style="height:100%"></span><span style="height:55%"></span>
          <span style="height:85%"></span><span style="height:30%"></span><span style="height:70%"></span>
          <span style="height:95%"></span><span style="height:45%"></span><span style="height:65%"></span>
        </div>
      </div>
    </div>

    <div class="confirmation-actions">
      <button class="primary" onclick="window.print()">Print ticket</button>
      <a href="events.html">Book another</a>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
